[package]
name = "recharged-wfc-srv"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "tracing", "query"] }
base64 = "0.23.1"
rand = "0.10.3"
serde = { version = "1", features = ["derive"] }
sha1 = "0.11.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter", "std"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
