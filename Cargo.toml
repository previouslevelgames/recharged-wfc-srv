[package]
name = "recharged-wfc-srv"
version = "1.2.1"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "tracing", "query", "form"] }
axum-extra = { version = "0.12", default-features = false, features = ["cookie"] }
base64 = "0.23.1"
# Signs NAS login tokens.
hmac = "0.13"
# GPCM's login proofs.
md-5 = "0.11"
rand = "0.10.3"
# Google sign-in for /admin. Root certificates come from the system store.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11"
# TCP keepalive for GPCM logins.
socket2 = { version = "0.6", features = ["all"] }
sqlx = { version= "0.9.0", default-features = false, features = [ "runtime-tokio", "postgres", "macros", "migrate", "time" ] }
time = { version = "0.3.55", features = ["serde-well-known"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter", "std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
