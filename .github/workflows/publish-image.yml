name: Publish server image

on:
  push:
    branches: [master, stable]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container: rust:1.95-bookworm
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Rust
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/stable' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/stable' }}
            type=sha,prefix=sha-,format=long

      - name: Build image for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: recharged-wfc-srv:test
          build-args: GIT_COMMIT=${{ github.sha }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify API, PostgreSQL persistence, and shutdown
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python3 scripts/test-container.py recharged-wfc-srv:test "$EXPECTED_REVISION"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/stable'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/stable'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
