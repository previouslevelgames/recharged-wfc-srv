name: Build server image

# Every push and pull request into main runs the checks and verifies the image.
# A pull request into stable (a release) also publishes its test image
# test-pr<N>, which test-builds.yml removes when the pull request closes, and
# moves the tag test to it for test servers that follow every release. A push
# to stable (the merged release) publishes the image sha-<commit> once and
# drafts the release of its version; release.yml tags that image v<version>,
# stable and latest when the draft is published.
on:
  pull_request:
    branches: [main, stable]
  push:
    branches: [main, stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A pull request builds its head, the commit that is released, not GitHub's
  # merge commit.
  REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # The stable branch requires the checks "check" and "publish": keep both job
  # names.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: rust:1.95-bookworm
    # For #[sqlx::test]: each test gets a fresh database on this server.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.REVISION }}

      - name: Check Rust
        env:
          GIT_COMMIT: ${{ env.REVISION }}
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
          # Query macros check against .sqlx/ (`just prepare`), like the image build.
          SQLX_OFFLINE: "true"
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.REVISION }}

      - name: Choose the image tags
        id: image
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=""
          if [ "$EVENT" = pull_request ] && [ "$BASE" = stable ] && [ "$SAME_REPOSITORY" = true ]; then
            # A release pull request: its newest test image, one per commit, and
            # test, the newest of all release pull requests.
            tags="$image:test $image:test-pr$PR_NUMBER $image:test-pr$PR_NUMBER-${REVISION:0:12}"
          elif [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/stable ]; then
            # The merged release; release.yml tags it when the release is published.
            tags="$image:sha-$REVISION"
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: recharged-wfc-srv:test
          build-args: GIT_COMMIT=${{ env.REVISION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify API, PostgreSQL persistence, and shutdown
        run: python3 scripts/test-container.py recharged-wfc-srv:test "$REVISION"

      - name: Log in to GitHub Container Registry
        if: steps.image.outputs.tags != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The verified image itself, not a second build.
      - name: Publish the verified image
        if: steps.image.outputs.tags != ''
        env:
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag recharged-wfc-srv:test "$tag"
            docker push "$tag"
            echo "Published \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done

  release:
    # Drafts the GitHub release of a stable build whose version is not yet
    # released (tag v<version> on that commit); publish it after a review.
    name: draft release
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Find the version to release
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A version already tagged or with a (draft) release is not drafted again.
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/v$version" >/dev/null ||
             gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -qx "v$version"; then
            echo "::notice::Version $version is already released or drafted; raise it in Cargo.toml for a new release."
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Draft the release
        if: steps.version.outputs.draft == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="v$VERSION" \
            -f target_commitish="$GITHUB_SHA" --jq .body > notes.md
          cat >> notes.md <<EOF

          ---

          Image: \`$image:v$VERSION\`, also \`stable\` and \`latest\` while this is the newest release. Unraid's auto-update follows \`stable\`.
          EOF
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "${GITHUB_REPOSITORY#*/} $VERSION" --notes-file notes.md
