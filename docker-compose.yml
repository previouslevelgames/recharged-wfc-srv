services:
  server:
    image: ${SERVER_IMAGE:-ghcr.io/previouslevelgames/recharged-wfc-srv:latest}
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      # The game reaches NAS and gamestats2 on port 80.
      - "${HTTP_PORT:-80}:8080"
      - "29900:29900"
      - "27900:27900/udp"
      - "28910:28910"
      - "27901:27901/udp"
    environment:
      PORT: "8080"
      POSTGRES_DB: ${POSTGRES_DB:-recharged_wfc}
      POSTGRES_USER: ${POSTGRES_USER:-recharged_wfc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PUBLIC_URL: ${PUBLIC_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_GOOGLE_EMAILS: ${ADMIN_GOOGLE_EMAILS:-}
      OWNER_GOOGLE_EMAILS: ${OWNER_GOOGLE_EMAILS:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      PROFILES_TEST_SIGN_IN: ${PROFILES_TEST_SIGN_IN:-}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-}
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql
      - ${LOG_DATA_DIR:-./data/logs}:/var/log/recharged-wfc-srv
