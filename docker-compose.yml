services:
  server:
    image: ${SERVER_IMAGE:-ghcr.io/previouslevelgames/recharged-wfc-srv:latest}
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      POSTGRES_DB: ${POSTGRES_DB:-recharged_wfc}
      POSTGRES_USER: ${POSTGRES_USER:-recharged_wfc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql
